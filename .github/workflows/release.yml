# Release: build the .vsix and publish it as a GitHub release.
#
#   Push a tag that matches package.json's version:
#     npm version patch        # bumps package.json, commits, tags v0.0.2
#     git push --follow-tags
#
#   Or run it by hand (Actions → Release → Run workflow) to build the .vsix
#   as a downloadable artifact without making a release.
#
# Windows, because that is where Yellowscript is developed and used: the
# command classification, the cmd.exe shell note and the path handling are
# all tested on it. src/vendor/agent-core stays LF (.gitattributes), so the
# hash check passes whatever the runner's autocrlf is.

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The tests are .ts files run by node --test, which needs Node's
          # built-in type stripping (on by default from Node 23.6).
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::Tag ${tag} does not match package.json version ${version}. Run npm version, or tag v${version}."
            exit 1
          fi

      # npm run package is the whole gate: the agent-core hash check, tsc,
      # svelte-check, the tests, the production build, then vsce.
      - name: Check, build and package
        run: npm run package

      - name: Name the package
        id: vsix
        run: |
          file=$(ls *.vsix)
          echo "file=${file}" >> "$GITHUB_OUTPUT"
          echo "Packaged ${file} ($(du -h "${file}" | cut -f1))"

      - name: Keep the .vsix as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vsix.outputs.file }}
          path: ${{ steps.vsix.outputs.file }}
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          # A version with a pre-release part (0.1.0-beta.1) is a pre-release.
          prerelease=""
          case "${version}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" "${{ steps.vsix.outputs.file }}" \
            --title "Yellowscript ${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease}
